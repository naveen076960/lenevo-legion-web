<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#0b0b0b" />
      <stop offset="100%" stop-color="#151515" />
    </linearGradient>
    <filter id="f1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feBlend in="SourceGraphic" in2="b" mode="normal"/>
    </filter>
  </defs>

  <!-- Outer shadow ring -->
  <rect x="60" y="60" width="480" height="480" rx="36" fill="url(#g1)" stroke="#0e0e0e" stroke-width="2" />

  <!-- Inner chip -->
  <rect x="140" y="140" width="320" height="320" rx="18" fill="#0a0a0a" stroke="#1c1c1c" stroke-width="1" filter="url(#f1)" />

  <!-- Pins -->
  <g fill="#0b0b0b">
    <!-- top -->
    <rect x="160" y="120" width="24" height="12" rx="3" />
    <rect x="200" y="120" width="24" height="12" rx="3" />
    <rect x="240" y="120" width="24" height="12" rx="3" />
    <rect x="280" y="120" width="24" height="12" rx="3" />
    <rect x="320" y="120" width="24" height="12" rx="3" />
    <rect x="360" y="120" width="24" height="12" rx="3" />
  </g>

  <!-- pattern inside -->
  <g opacity="0.12" fill="#fff">
    <rect x="180" y="180" width="20" height="20" rx="3" />
    <rect x="210" y="180" width="20" height="20" rx="3" />
    <rect x="240" y="180" width="20" height="20" rx="3" />
    <rect x="270" y="180" width="20" height="20" rx="3" />

    <rect x="180" y="210" width="20" height="20" rx="3" />
    <rect x="210" y="210" width="20" height="20" rx="3" />
    <rect x="240" y="210" width="20" height="20" rx="3" />
    <rect x="270" y="210" width="20" height="20" rx="3" />

    <rect x="320" y="240" width="60" height="6" rx="3" />
  </g>

  <!-- subtle glow -->
  <circle cx="300" cy="300" r="140" fill="rgba(255,255,255,0.02)" />

  <!-- small detail lines -->
  <g stroke="#111" stroke-width="1.2" opacity="0.6">
    <path d="M200 260h200" />
    <path d="M200 320h200" />
    <path d="M260 200v200" />
    <path d="M340 200v200" />
  </g>

</svg>
